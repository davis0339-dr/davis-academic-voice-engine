name: Live Render Probe

on:
  push:
    branches: [diagnose/runtime-loading-smoke]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live hotfix
        shell: bash
        run: |
          set -euo pipefail
          LIVE_URL='https://davis-academic-voice-engine.onrender.com'
          probe() {
            local path="$1"
            printf '%-42s ' "$path"
            curl -L -sS -o /dev/null --connect-timeout 10 --max-time 25 \
              -w 'HTTP=%{http_code} DNS=%{time_namelookup}s CONNECT=%{time_connect}s TTFB=%{time_starttransfer}s TOTAL=%{time_total}s SIZE=%{size_download}\n' \
              "$LIVE_URL$path"
          }

          echo '--- root and static assets ---'
          for path in \
            / \
            /styles.css \
            /safeDom.js \
            /fileImport.js \
            /runtimeGuard.js \
            /researchEnhancements.js \
            /app.js \
            /plannerObservability.js \
            /rewriteVerdict.js \
            /researchStudioUI.js \
            /researchStudioCapabilitiesUI.js \
            /detectorEvidenceUI.js \
            /detectorResearchUI.js \
            /authorialTextureUI.js; do
            probe "$path"
          done

          echo '--- startup endpoints ---'
          for path in \
            /api/health \
            /api/health/llm \
            /api/style-profiles \
            /api/methodology \
            /api/health/detectors \
            /api/detector-research/evidence; do
            probe "$path"
          done

          echo '--- repeat health/llm five times to catch intermittent stalls ---'
          for i in 1 2 3 4 5; do
            printf 'health/llm #%s ' "$i"
            curl -L -sS -o /dev/null --connect-timeout 10 --max-time 25 \
              -w 'HTTP=%{http_code} TTFB=%{time_starttransfer}s TOTAL=%{time_total}s\n' \
              "$LIVE_URL/api/health/llm"
          done
