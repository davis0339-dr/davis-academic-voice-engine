name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - name: Apply rewrite route acceptance integration
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('server/routes/rewrite.js')
          s = path.read_text()

          old = 'import { selectiveResidualRework } from "../lib/residualRework.js";\n'
          if 'import { auditOutputAcceptance } from "../lib/outputAcceptance.js";' not in s:
              if old not in s:
                  raise SystemExit('residual rework import not found')
              s = s.replace(old, old + 'import { auditOutputAcceptance } from "../lib/outputAcceptance.js";\n', 1)

          old_status = '''function finalCandidateStatus(compliance, residual, sourceRetainedForSafety = false) {
            if (sourceRetainedForSafety) return "no_safe_edit_available";
            if (!compliance?.execution_passed && !compliance?.preservation_ok) return "execution_and_preservation_failed";
            if (!compliance?.execution_passed) {
              if (compliance?.execution_status === "over-executed") return "execution_over";
              if (compliance?.execution_status === "conflicting-execution") return "execution_conflict";
              return "execution_under";
            }
            if (!compliance?.preservation_ok) return "preservation_failed";
            if (residual?.attempted && !residual?.accepted && residual?.before?.should_rework) return "accepted_with_residual_risks";
            return "accepted";
          }'''
          new_status = '''function finalCandidateStatus(
            compliance,
            residual,
            outputAcceptance,
            outputAcceptanceEnforced = false,
            sourceRetainedForSafety = false
          ) {
            if (sourceRetainedForSafety) return "no_safe_edit_available";
            if (!compliance?.execution_passed && !compliance?.preservation_ok) return "execution_and_preservation_failed";
            if (!compliance?.execution_passed) {
              if (compliance?.execution_status === "over-executed") return "execution_over";
              if (compliance?.execution_status === "conflicting-execution") return "execution_conflict";
              return "execution_under";
            }
            if (!compliance?.preservation_ok) return "preservation_failed";
            if (outputAcceptanceEnforced && outputAcceptance?.status !== "pass") return "internal_quality_review_required";
            if (residual?.attempted && !residual?.accepted && residual?.before?.should_rework) return "accepted_with_residual_risks";
            return "accepted";
          }'''
          if 'outputAcceptanceEnforced && outputAcceptance?.status !== "pass"' not in s:
              if old_status not in s:
                  raise SystemExit('finalCandidateStatus block not found')
              s = s.replace(old_status, new_status, 1)

          old_residual = '''          residualRework = await selectiveResidualRework({
            sourceText: text,
            candidateText: result.revised_text,
          });'''
          new_residual = '''          residualRework = await selectiveResidualRework({
            sourceText: text,
            candidateText: result.revised_text,
            styleFilters: styleFilters || {},
            rewriteIntensity: modePolicy.effective_intensity,
            naturalisation: modePolicy.effective_naturalisation,
            planSummary: result.intervention_plan_summary || {},
          });'''
          if 'planSummary: result.intervention_plan_summary || {}' not in s:
              if old_residual not in s:
                  raise SystemExit('selectiveResidualRework call not found')
              s = s.replace(old_residual, new_residual, 1)

          acceptance_block = '''      const completedOutputAcceptance = auditOutputAcceptance({
        sourceText: text,
        candidateText: result.revised_text,
        styleFilters: styleFilters || {},
        rewriteIntensity: modePolicy.effective_intensity,
        naturalisation: modePolicy.effective_naturalisation,
        planSummary: result.intervention_plan_summary || {},
      });
      const outputAcceptanceEnforced = Boolean(
        ["moderate", "deep"].includes(String(modePolicy.effective_intensity || "").toLowerCase()) &&
        ["aggressive", "authorial"].includes(String(modePolicy.effective_naturalisation || "").toLowerCase())
      );
      result.output_acceptance = {
        ...completedOutputAcceptance,
        enforced_for_final_release: outputAcceptanceEnforced,
      };

'''
          marker = '      result.execution_compliance = {\n'
          if 'enforced_for_final_release' not in s:
              if marker not in s:
                  raise SystemExit('execution compliance marker not found')
              s = s.replace(marker, acceptance_block + marker, 1)

          old_chain = '''      } else if (result.iterative_rewrite_quality?.blocking) {
        verdictNote = "The candidate still shows cumulative rewrite-chain regularisation relative to the retained root source. It is preserved for auditability, but the result should be reviewed rather than treated as a successful authorial recovery.";
      } else {'''
          new_chain = '''      } else if (outputAcceptanceEnforced && completedOutputAcceptance.status !== "pass") {
        verdictNote = `Completed-output acceptance did not clear this ${modePolicy.effective_intensity} + ${modePolicy.effective_naturalisation} candidate. Residual machine-pattern regularity, source-skeleton dependence or another completed-output quality condition remains unresolved. Do not treat this as a successful authorial result or spend an external detector check until the internal gate passes.`;
      } else if (result.iterative_rewrite_quality?.blocking) {
        verdictNote = "The candidate still shows cumulative rewrite-chain regularisation relative to the retained root source. It is preserved for auditability, but the result should be reviewed rather than treated as a successful authorial recovery.";
      } else {'''
          if 'Completed-output acceptance did not clear this' not in s:
              if old_chain not in s:
                  raise SystemExit('verdict chain not found')
              s = s.replace(old_chain, new_chain, 1)

          old_verdict = '''        rewrite_chain: result.iterative_rewrite_quality?.available
          ? (result.iterative_rewrite_quality.blocking ? "regularisation-risk" : "within-root-register-band")
          : "not-applicable",
        final_status: finalCandidateStatus(executionCompliance, residualRework, sourceRetainedForSafety),
        note: verdictNote,'''
          new_verdict = '''        rewrite_chain: result.iterative_rewrite_quality?.available
          ? (result.iterative_rewrite_quality.blocking ? "regularisation-risk" : "within-root-register-band")
          : "not-applicable",
        output_acceptance: completedOutputAcceptance.status,
        output_acceptance_score: completedOutputAcceptance.score,
        output_acceptance_enforced: outputAcceptanceEnforced,
        external_detector_check_recommended: Boolean(
          completedOutputAcceptance.release_gate?.external_detector_check_recommended &&
          (!outputAcceptanceEnforced || completedOutputAcceptance.status === "pass")
        ),
        final_status: finalCandidateStatus(
          executionCompliance,
          residualRework,
          completedOutputAcceptance,
          outputAcceptanceEnforced,
          sourceRetainedForSafety
        ),
        note: verdictNote,'''
          if 'output_acceptance_score: completedOutputAcceptance.score' not in s:
              if old_verdict not in s:
                  raise SystemExit('candidate verdict block not found')
              s = s.replace(old_verdict, new_verdict, 1)

          path.write_text(s)
          PY

          cat > tests/rewriteRouteOutputAcceptanceIntegration.test.js <<'EOF'
          import { test } from "node:test";
          import assert from "node:assert/strict";
          import fs from "node:fs";

          const route = fs.readFileSync(new URL("../server/routes/rewrite.js", import.meta.url), "utf8");

          test("rewrite route forwards full context into selective residual recovery", () => {
            assert.match(route, /selectiveResidualRework\(\{[\s\S]*styleFilters: styleFilters \|\| \{\}[\s\S]*rewriteIntensity: modePolicy\.effective_intensity[\s\S]*naturalisation: modePolicy\.effective_naturalisation[\s\S]*planSummary: result\.intervention_plan_summary \|\| \{\}/);
          });

          test("completed-output acceptance runs after residual recovery and before final verdict", () => {
            const residualIndex = route.indexOf("selectiveResidualRework({");
            const acceptanceIndex = route.indexOf("const completedOutputAcceptance = auditOutputAcceptance({");
            const verdictIndex = route.indexOf("result.candidate_verdict = {");
            assert.ok(residualIndex >= 0);
            assert.ok(acceptanceIndex > residualIndex);
            assert.ok(verdictIndex > acceptanceIndex);
          });

          test("Moderate/Deep assertive output gate can block final acceptance", () => {
            assert.match(route, /outputAcceptanceEnforced && outputAcceptance\?\.status !== "pass"\) return "internal_quality_review_required"/);
            assert.match(route, /\["moderate", "deep"\]/);
            assert.match(route, /\["aggressive", "authorial"\]/);
          });

          test("candidate verdict reports internal acceptance and external-check recommendation", () => {
            assert.match(route, /output_acceptance: completedOutputAcceptance\.status/);
            assert.match(route, /output_acceptance_score: completedOutputAcceptance\.score/);
            assert.match(route, /external_detector_check_recommended:/);
          });
          EOF
      - name: Install dependencies
        run: npm ci
      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high
      - name: Reject committed environment secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Eq '(^|/)\.env$'; then
            echo 'A .env file is tracked by Git. Secrets must remain in the deployment secret manager.'
            exit 1
          fi
          if git grep -nE '(sk-ant-api03-[A-Za-z0-9_-]{20,}|sk-proj-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{30,})' -- . ':!package-lock.json'; then
            echo 'A credential-like secret pattern was found in tracked files.'
            exit 1
          fi
      - name: Check browser and research JavaScript syntax
        run: |
          node --check public/safeDom.js
          node --check public/app.js
          node --check public/fileImport.js
          node --check public/runtimeGuard.js
          node --check public/optionalFeatures.js
          node --check public/rewriteLineage.js
          node --check public/detectorQuickBridge.js
          node --check public/workspaceHandoff.js
          node --check public/studioBootstrap.js
          node --check public/studioVoiceUI.js
          node --check public/plannerObservability.js
          node --check public/rewriteVerdict.js
          node --check public/authorialTextureUI.js
          node --check public/detectorResearchUI.js
          node --check public/detectorEvidenceUI.js
          node --check public/researchStudioUI.js
          node --check public/researchStudioEvidenceGateway.js
          node --check public/researchStudioEvidenceCoreUI.js
          node --check public/researchStudioCapabilitiesUI.js
          node --check public/researchStudioCandidateBridge.js
          node --check public/researchEvidenceBankUI.js
          node --check public/researchEvidenceUploadRouter.js
          node --check public/longDocumentEvidenceHandoffUI.js
          node --check public/longDocumentVNextUI.js
          node --check server/lib/iterativeRewriteGuard.js
          node --check server/lib/underExecutionRecovery.js
          node --check server/lib/interventionAuthority.js
          node --check server/lib/executionCompliance.js
          node --check server/lib/outputAcceptance.js
          node --check server/lib/residualRework.js
          node --check server/lib/pipeline.js
          node --check server/routes/rewrite.js
          node --check server/lib/researcherAgency.js
          node --check server/routes/researchStudio.js
          node --check server/routes/evidenceEnhance.js
          node --check scripts/run-output-acceptance-benchmark.js
          node --check server/index.js
      - name: Production-style server startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          export PORT=3011
          node server/index.js > server-smoke.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in {1..20}; do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3011/api/health > health-smoke.json; then
              READY=1
              break
            fi
            sleep 0.5
          done
          if [ "$READY" -ne 1 ]; then
            echo 'Server did not become healthy within 10 seconds.'
            cat server-smoke.log || true
            exit 1
          fi
          curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3011/ > index-smoke.html
          curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3011/editor > editor-smoke.html
          curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3011/studio > studio-smoke.html
          curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3011/api/style-profiles > style-profiles-smoke.json
          curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3011/api/methodology > methodology-smoke.json
          curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3011/api/health/detectors > detector-health-smoke.json
          curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3011/api/detector-research/evidence > detector-evidence-smoke.json
          test -s index-smoke.html
          test -s editor-smoke.html
          test -s studio-smoke.html
          grep -q 'Academic Voice Engine' index-smoke.html
          grep -q 'Editor + Detector' editor-smoke.html
          grep -q 'Research &amp; Evidence Studio' studio-smoke.html
          grep -q '/runtimeGuard.js' index-smoke.html
          grep -q '/detectorQuickBridge.js' public/optionalFeatures.js
          grep -q '/rewriteLineage.js' public/optionalFeatures.js
          grep -q '/longDocumentVNextUI.js' public/optionalFeatures.js
          grep -q '/researchStudioUI.js?v=3.1.0' studio-smoke.html
          grep -q '/researchStudioEvidenceGateway.js?v=3.0.0' studio-smoke.html
          grep -q '/researchEvidenceBankUI.js?v=3.2.0' studio-smoke.html
          grep -q '/researchEvidenceUploadRouter.js?v=3.1.1' studio-smoke.html
          grep -q 'evidenceGatewayFiles' studio-smoke.html
          grep -q 'evidenceGatewayPasteText' studio-smoke.html
          grep -q 'Evidence Gateway v3.1.1' studio-smoke.html
          grep -q '/researchStudioEvidenceCoreUI.js' studio-smoke.html
          grep -q '/researchStudioCandidateBridge.js' studio-smoke.html
          grep -q 'transferToResearchStudio' public/researchStudioEvidenceGateway.js
          grep -q 'waitForElement("literatureBankFile")' public/researchEvidenceUploadRouter.js
          grep -q 'interceptDirectWorkspaceSpreadsheetChange' public/researchEvidenceUploadRouter.js
          grep -q 'BANK_VERSION = "3.2.0"' public/researchEvidenceBankUI.js
          grep -q 'literatureBankSheetSelect' public/researchEvidenceBankUI.js
          grep -q 'browseResearchEvidenceBtn' public/researchStudioEvidenceCoreUI.js
          grep -q 'evidencePasteText' public/researchStudioEvidenceCoreUI.js
          grep -q 'evidence-enhance-candidate' server/routes/evidenceEnhance.js
          cat server-smoke.log
      - name: Run test suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      - name: Run completed-output acceptance benchmark
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-output-acceptance-benchmark.js 2>&1 | tee output-acceptance-benchmark.txt
      - name: Run thesis language simulation
        shell: bash
        run: |
          set -o pipefail
          node scripts/simulate-language-engine.js 2>&1 | tee language-simulation.txt
      - name: Commit verified route integration
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No route integration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/routes/rewrite.js tests/rewriteRouteOutputAcceptanceIntegration.test.js
          git commit -m 'Wire completed-output acceptance into rewrite route'
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ github.run_id }}
          path: |
            test-output.txt
            output-acceptance-benchmark.txt
            output-acceptance-benchmark.json
            language-simulation.txt
            language-simulation.json
            server-smoke.log
            health-smoke.json
            index-smoke.html
            editor-smoke.html
            studio-smoke.html
            style-profiles-smoke.json
            methodology-smoke.json
            detector-health-smoke.json
            detector-evidence-smoke.json
          if-no-files-found: ignore
          retention-days: 7
