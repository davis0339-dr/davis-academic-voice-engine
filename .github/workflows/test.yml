name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high
      - name: Reject committed environment secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Eq '(^|/)\.env$'; then
            echo 'A .env file is tracked by Git. Secrets must remain in the deployment secret manager.'
            exit 1
          fi
          if git grep -nE '(sk-ant-api03-[A-Za-z0-9_-]{20,}|sk-proj-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{30,})' -- . ':!package-lock.json'; then
            echo 'A credential-like secret pattern was found in tracked files.'
            exit 1
          fi
      - name: Check browser and research JavaScript syntax
        run: |
          node --check public/safeDom.js
          node --check public/app.js
          node --check public/fileImport.js
          node --check public/plannerObservability.js
          node --check public/rewriteVerdict.js
          node --check public/authorialTextureUI.js
          node --check public/detectorResearchUI.js
          node --check public/detectorEvidenceUI.js
          node --check public/researchStudioUI.js
          node --check public/researchStudioCapabilitiesUI.js
          node --check server/lib/researcherAgency.js
          node --check server/routes/researchStudio.js
      - name: Production-style server startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          export PORT=3011
          node server/index.js > server-smoke.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in {1..20}; do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3011/api/health > health-smoke.json; then
              READY=1
              break
            fi
            sleep 0.5
          done
          if [ "$READY" -ne 1 ]; then
            echo 'Server did not become healthy within 10 seconds.'
            cat server-smoke.log || true
            exit 1
          fi
          curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3011/ > index-smoke.html
          curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3011/api/style-profiles > style-profiles-smoke.json
          curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3011/api/methodology > methodology-smoke.json
          curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3011/api/health/detectors > detector-health-smoke.json
          test -s index-smoke.html
          grep -q 'Academic Voice Engine' index-smoke.html
          cat server-smoke.log
      - name: Probe live Render browser dependencies
        shell: bash
        continue-on-error: true
        run: |
          set +e
          LIVE_URL='https://davis-academic-voice-engine.onrender.com'
          : > live-render-probe.txt
          probe() {
            local path="$1"
            local label="$2"
            echo "--- $label $path ---" | tee -a live-render-probe.txt
            curl -L -sS --connect-timeout 8 --max-time 20 -o /tmp/live-probe-body -w 'HTTP=%{http_code} CONNECT=%{time_connect}s TTFB=%{time_starttransfer}s TOTAL=%{time_total}s SIZE=%{size_download}\n' "$LIVE_URL$path" 2>&1 | tee -a live-render-probe.txt
            echo "curl_exit=${PIPESTATUS[0]}" | tee -a live-render-probe.txt
          }
          echo "Probe time (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a live-render-probe.txt
          echo "URL: $LIVE_URL" | tee -a live-render-probe.txt
          probe '/' 'root'
          for asset in /styles.css /safeDom.js /fileImport.js /researchEnhancements.js /app.js /plannerObservability.js /rewriteVerdict.js /authorialTextureUI.js /detectorResearchUI.js /detectorEvidenceUI.js /researchStudioUI.js /researchStudioCapabilitiesUI.js; do
            probe "$asset" 'asset'
          done
          for endpoint in /api/health /api/health/llm /api/style-profiles /api/methodology /api/health/detectors; do
            probe "$endpoint" 'endpoint'
          done
          curl -L -sS --connect-timeout 8 --max-time 20 "$LIVE_URL/api/health" > live-health.json 2>/dev/null || true
          curl -L -sS --connect-timeout 8 --max-time 20 "$LIVE_URL/" > live-root.html 2>/dev/null || true
          exit 0
      - name: Headless browser runtime probe
        shell: bash
        continue-on-error: true
        run: |
          set +e
          LIVE_URL='https://davis-academic-voice-engine.onrender.com'
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          echo "browser=$BROWSER" | tee browser-runtime.log
          if [ -z "$BROWSER" ]; then
            echo 'No Chromium-family browser preinstalled on runner.' | tee -a browser-runtime.log
            exit 0
          fi
          timeout 35s "$BROWSER" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=15000 \
            --enable-logging=stderr \
            --v=0 \
            --dump-dom "$LIVE_URL/" > live-browser-dom.html 2> browser-runtime.log
          BROWSER_EXIT=$?
          echo "browser_exit=$BROWSER_EXIT" >> browser-runtime.log
          echo '--- key rendered states ---' >> browser-runtime.log
          grep -Eo 'LLM: [^<]+' live-browser-dom.html | head -5 >> browser-runtime.log || true
          grep -Eo 'build: [^<]+' live-browser-dom.html | head -5 >> browser-runtime.log || true
          grep -Eo 'Single editor: [^<]+' live-browser-dom.html | head -5 >> browser-runtime.log || true
          grep -Eo 'Current beta benchmark: [^<]+' live-browser-dom.html | head -5 >> browser-runtime.log || true
          grep -Eo 'Could not load coverage data|Loading corpus coverage…|checking service status…|Single editor capacity: loading…' live-browser-dom.html >> browser-runtime.log || true
          cat browser-runtime.log
          exit 0
      - name: Run test suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      - name: Run thesis language simulation
        shell: bash
        run: |
          set -o pipefail
          node scripts/simulate-language-engine.js 2>&1 | tee language-simulation.txt
      - name: Retain test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ github.run_id }}
          path: |
            test-output.txt
            language-simulation.txt
            language-simulation.json
            server-smoke.log
            health-smoke.json
            style-profiles-smoke.json
            methodology-smoke.json
            detector-health-smoke.json
            live-render-probe.txt
            live-root.html
            live-health.json
            browser-runtime.log
            live-browser-dom.html
          if-no-files-found: ignore
          retention-days: 7
